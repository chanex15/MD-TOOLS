# fly.toml — MD-TOOL on Fly.io
#
# First run:
#   fly launch --no-deploy     # or set `app` below to a unique name
#   fly deploy
#
# After a URL exists, set it so canonical/OG tags, sitemap.xml and robots.txt
# use the right origin (this also switches on HSTS + http -> https):
#   fly secrets set SITE_URL="https://<your-app>.fly.dev"

app = "md-tool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true

  # Job state lives in memory and progress is streamed over SSE, so the app must
  # keep running. Scale this app to a single machine; a second instance would
  # not see the first one's jobs.
  auto_stop_machines = false
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
